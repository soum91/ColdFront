name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: ColdFront          # Xcode target / bundle (kept so installs update in place)
  DISPLAY: Equinox
  BUILD: ${{ github.run_number }}
  TAG: build-${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project ColdFront.xcodeproj \
            -scheme ColdFront \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/$APP.app Payload/
          PLIST=Payload/$APP.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          # Sideloaders (FlareStore etc.) only compare the version string, so make it <version>.<build>.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$PLIST"
          EXT="Payload/ColdFront.app/PlugIns/EquinoxWidget.appex"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION.$BUILD" "$EXT/Info.plist"
          codesign --force --sign - --timestamp=none --entitlements "$GITHUB_WORKSPACE/EquinoxWidget/EquinoxWidget.entitlements" "$EXT"
          codesign --force --sign - --timestamp=none --entitlements "$GITHUB_WORKSPACE/ColdFront/ColdFront.entitlements" "Payload/ColdFront.app"
          IPA="$DISPLAY-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          .github/scripts/release-notes.sh "$DISPLAY" "$VERSION" "$BUILD" 'build-*' "$TAG" \
            "Unsigned IPA. Sideload with AltStore or Sideloadly." > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-build-${{ env.BUILD }}-ipa
          path: ${{ env.IPA }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Equinox ${{ env.VERSION }} build ${{ env.BUILD }}
          body_path: release-notes.md
          files: ${{ env.IPA }}
          make_latest: true

      - name: Update sideloading source (FlareStore / AltStore / SideStore)
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$IPA"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/source"
            if git fetch -q origin source; then
              git worktree add -q -f --detach "$RUNNER_TEMP/source" FETCH_HEAD
            else
              git worktree add -q -f --detach "$RUNNER_TEMP/source"
              git -C "$RUNNER_TEMP/source" checkout -q --orphan source
              git -C "$RUNNER_TEMP/source" rm -rqf .
            fi
            python3 .github/scripts/update-source.py "$RUNNER_TEMP/source/source.json" "$IPA" "$URL" "release-notes.md"
            git -C "$RUNNER_TEMP/source" add source.json
            git -C "$RUNNER_TEMP/source" commit -qm "Source: $DISPLAY build $BUILD"
            git -C "$RUNNER_TEMP/source" push -q origin HEAD:refs/heads/source && break
            git worktree remove -f "$RUNNER_TEMP/source"
            sleep 5
          done
