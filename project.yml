name: ColdFront
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: 1.6.0
    CURRENT_PROJECT_VERSION: '1'
targets:
  ColdFront:
    type: application
    platform: iOS
    sources:
    - path: ColdFront
    - path: Shared
    info:
      path: ColdFront/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Equinox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
        - fetch
        NSLocationWhenInUseUsageDescription: Equinox uses your location to run scenes
          when you arrive or leave home.
        NSLocationAlwaysAndWhenInUseUsageDescription: Equinox runs your arrive/leave
          home scenes in the background, even when the app is closed. Choose Always
          for that to work.
        NSBluetoothAlwaysUsageDescription: Equinox reads your Govee thermometer's
          broadcasts to get the room temperature and humidity.
        BGTaskSchedulerPermittedIdentifiers:
        - com.soum91.coldfront.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.coldfront
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ''
    dependencies:
    - target: EquinoxWidget
    entitlements:
      path: ColdFront/ColdFront.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.soum91.coldfront
  EquinoxWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: EquinoxWidget
    - path: Shared
    info:
      path: EquinoxWidget/Info.plist
      properties:
        CFBundleDisplayName: ColdFront
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EquinoxWidget/EquinoxWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.soum91.coldfront
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.coldfront.widget
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: 1,2
