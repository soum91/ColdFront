name: ColdFront
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ColdFront:
    type: application
    platform: iOS
    sources:
      - path: ColdFront
    info:
      path: ColdFront/Info.plist
      properties:
        CFBundleDisplayName: Equinox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        NSBluetoothAlwaysUsageDescription: Equinox reads your Govee thermometer's broadcasts to get the room temperature and humidity.
        BGTaskSchedulerPermittedIdentifiers: [com.soum91.coldfront.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.coldfront
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
